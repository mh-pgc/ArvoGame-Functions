<!DOCTYPE html>
<html>
<head>
    <title>Unity API Functions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; color: #333; }
        .status { color: #00A2A0; font-weight: bold; }
        .endpoint { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #00A2A0; }
    </style>
</head>
<body>
    <h1>Unity API Functions</h1>
    <p class="status">✅ Functions deployed successfully</p>
    
    <div class="endpoint">
        <strong>/.netlify/functions/getSasKey</strong><br>
        <small>Secure SAS key endpoint</small>
    </div>
    <div class="endpoint">
        <strong>/.netlify/functions/getDebugKey</strong><br>
        <small>Secure debug key endpoint</small>
    </div>
    
    <div class="proxy">
        <strong>/.netlify/functions/proxy</strong><br>
        <small>Secure proxy endpoint</small>
    </div>

    <p><small>These functions provide secure key access for Unity WebGL applications.</small></p>
</body>
</html>
